# Render Blueprint: one web service (FastAPI + built React app). The database stays on Supabase.
# Secret values are never stored here; Render prompts for every `sync: false` variable on first deploy.
services:
  - type: web
    name: projectforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Supabase connection string (session pooler, port 5432). Leave blank on first deploy to run on a
      # throwaway SQLite file inside the container: demo data is re-seeded on every restart or deploy.
      - key: DATABASE_URL
        sync: false
      # FRONTEND_URL is optional: it defaults to RENDER_EXTERNAL_URL, which Render sets automatically.
      - key: DEMO_MODE # true shows the demo accounts on the login page; set false for real use
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: DB_FALLBACK_TO_SQLITE # fail loudly instead of silently using a throwaway local database
        value: "false"
